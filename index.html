<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006734">
<title>Dtel · Produtividade CD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
  /* ===== Identidade Dtel ===== */
  :root{
    --green:#006734; --green-2:#00552B; --green-soft:#E6F0E9; --lime:#7BA93B; --yellow:#FEBF11; --yellow-2:#FFDE00;
    --bg:#F5F6F3; --card:#FFFFFF; --ink:#1D2520; --ink-2:#4F574F; --muted:#6E716C; --line:#E2E5DF; --line-2:#EEF0EC;
    --ok:#00552B; --ok-bg:#E6F0E9; --bad:#C62828; --bad-bg:#FDECEA; --warn:#7A5600; --warn-bg:#FFF4D1;
    --r:16px; --r-sm:12px;
    --ease:cubic-bezier(.2,.8,.2,1); --fast:160ms; --mid:240ms;
    --f:"Heebo","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--f);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation}
  .hidden{display:none!important}
  .num{font-variant-numeric:tabular-nums}

  /* ===== Cabeçalho ===== */
  header.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:10px 14px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,40,20,.18)}
  header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--yellow) 0 50%,var(--lime) 50% 100%)}
  header.top .logo{height:30px;width:auto;display:block}
  header.top .who{flex:1;min-width:0;line-height:1.15;padding-left:10px;border-left:1px solid rgba(255,255,255,.25)}
  header.top .who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:600}
  header.top .who b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibtn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;transition:transform var(--fast) var(--ease),background var(--fast)}
  .ibtn:active{transform:scale(.92);background:rgba(255,255,255,.26)}
  .ibtn svg{width:22px;height:22px}

  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(120px + var(--safe-b))}

  /* ===== Transição de telas ===== */
  .view{animation:viewIn var(--mid) var(--ease) both}
  .view.back{animation-name:viewBack}
  @keyframes viewIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes viewBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .rise{animation:rise var(--mid) var(--ease) both}
  .rise:nth-child(2){animation-delay:40ms}.rise:nth-child(3){animation-delay:80ms}.rise:nth-child(4){animation-delay:120ms}

  /* ===== Cartões e textos ===== */
  .card{background:var(--card);border-radius:var(--r);padding:18px;margin:0 0 14px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,40,25,.04)}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .muted{color:var(--muted);font-size:15px}
  label{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
  input,select,textarea{width:100%;min-height:54px;padding:13px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:18px;transition:border-color var(--fast),box-shadow var(--fast)}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 4px rgba(0,103,52,.14)}

  /* ===== Botões ===== */
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:var(--r-sm);padding:14px 18px;font-size:18px;font-weight:700;background:var(--green);color:#fff;margin-top:12px;transition:transform var(--fast) var(--ease),filter var(--fast),box-shadow var(--fast)}
  .btn:active{transform:scale(.97);filter:brightness(.95)}
  .btn svg{width:22px;height:22px;flex:none}
  .btn.sec{background:var(--green-soft);color:var(--green)}
  .btn.ghost{background:#fff;color:var(--ink-2);border:1.5px solid var(--line)}
  .btn.cta{background:var(--yellow);color:#1D2520;box-shadow:0 6px 18px rgba(254,191,17,.35)}
  .btn.danger{background:#fff;color:var(--bad);border:1.5px solid #F2C4C0}
  .btn:disabled{opacity:.5}
  .link{display:block;background:none;border:0;color:var(--bad);padding:14px;width:100%;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

  /* Ações grandes da tela inicial */
  .action{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;border-radius:20px;padding:22px 20px;margin:0 0 14px;transition:transform var(--fast) var(--ease),box-shadow var(--fast)}
  .action:active{transform:scale(.975)}
  .action .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
  .action .ic svg{width:30px;height:30px}
  .action b{display:block;font-size:21px;font-weight:800;line-height:1.15}
  .action span{display:block;font-size:15px;margin-top:3px}
  .action.main{background:var(--green);color:#fff;box-shadow:0 10px 24px rgba(0,103,52,.28)}
  .action.main .ic{background:var(--yellow);color:var(--green)}
  .action.main span{color:#CFE3D5}
  .action.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .action.alt .ic{background:var(--green-soft);color:var(--green)}
  .action.alt span{color:var(--muted)}
  /* Cartões de departamento: acendem ao tocar */
  .depcard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:20px;padding:22px 18px;margin:0 0 14px;transition:background 220ms var(--ease),border-color 220ms,color 220ms,transform 220ms var(--ease),opacity 220ms,box-shadow 220ms}
  .depcard:active{transform:scale(.98)}
  .depcard .ic{width:60px;height:60px;border-radius:16px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none;transition:background 220ms,color 220ms}
  .depcard .ic svg{width:32px;height:32px}
  .depcard .txt{flex:1;min-width:0}
  .depcard b{display:block;font-size:21px;font-weight:800;line-height:1.15}
  .depcard .sub{display:block;font-size:15px;color:var(--muted);margin-top:4px;transition:color 220ms}
  .depcard .ult{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--yellow);color:var(--ink)}
  .depcard .ok{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;transition:all 220ms var(--ease)}
  .depcard .ok svg{width:20px;height:20px}
  .depcard.last{border-color:var(--lime)}
  .depcard.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 14px 30px rgba(0,103,52,.32);transform:scale(1.02)}
  .depcard.on .ic{background:var(--yellow);color:var(--green)}
  .depcard.on .sub{color:#CFE3D5}
  .depcard.on .ok{background:var(--yellow);border-color:var(--yellow);color:var(--green);animation:pop 320ms var(--ease)}
  #depList.picking .depcard:not(.on){opacity:.4;transform:scale(.97)}
  @keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
  .action .badge{margin-left:auto;align-self:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--yellow);color:var(--ink)}
  .depbar{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;margin:0 0 14px;text-align:left;transition:transform var(--fast) var(--ease)}
  .depbar:active{transform:scale(.98)}
  .depbar .ic2{width:36px;height:36px;border-radius:10px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
  .depbar .ic2 svg{width:22px;height:22px}
  .depbar span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .depbar b{display:block;font-size:16px;font-weight:800;color:var(--green)}
  .depbar em{margin-left:auto;font-style:normal;font-size:14px;font-weight:700;color:var(--green)}
  .deptitle{font-size:22px;font-weight:800;margin:6px 2px 4px}
  .depsub{color:var(--muted);margin:0 2px 18px;font-size:15px}

  /* ===== Meu dia ===== */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{background:var(--bg);border-radius:14px;padding:14px 8px;text-align:center}
  .tile b{display:block;font-size:24px;font-weight:800;line-height:1.1;color:var(--green);font-variant-numeric:tabular-nums}
  .tile span{font-size:13px;color:var(--muted);font-weight:500}
  ul.list{list-style:none;margin:12px 0 0;padding:0}
  ul.list li{display:flex;align-items:center;gap:10px;padding:13px 2px;border-top:1px solid var(--line-2);font-size:16px}
  ul.list li:first-child{border-top:0}
  ul.list .grow{flex:1;min-width:0}
  ul.list .s{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;word-break:break-all}
  ul.list .x{width:40px;height:40px;border:0;border-radius:10px;background:var(--bg);color:var(--muted);font-size:22px;line-height:1;flex:none}
  ul.list li.new{animation:flash 700ms var(--ease)}
  @keyframes flash{0%{background:rgba(123,169,59,.28);transform:translateY(-6px);opacity:0}30%{opacity:1;transform:none}100%{background:transparent}}
  .tag{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.pend{background:var(--line-2);color:var(--muted)}

  /* ===== Sessão aberta ===== */
  .sess{padding:0;overflow:hidden;border:0;box-shadow:0 10px 30px rgba(0,60,30,.14)}
  .sess .head{background:var(--green);color:#fff;padding:18px 18px 16px;position:relative}
  .sess .head::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:100%;background:linear-gradient(90deg,var(--yellow) 0 50%,var(--lime) 50% 100%)}
  .sess .svc{font-size:21px;font-weight:800;margin:0;line-height:1.2}
  .sess .meta{color:#CFE3D5;font-size:14px;margin-top:4px}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);margin-bottom:6px}
  .live i{width:9px;height:9px;border-radius:50%;background:var(--yellow);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  .timer{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1;margin:12px 0 4px}
  .sess .body{padding:16px 18px 6px}
  .count{font-size:16px;color:var(--ink-2)}
  .count b{font-size:22px;color:var(--green)}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .seg button{min-height:52px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:16px;transition:all var(--fast) var(--ease)}
  .seg button:active{transform:scale(.96)}
  .seg button.on[data-r=APROVADO]{background:var(--ok-bg);border-color:var(--green);color:var(--ok)}
  .seg button.on[data-r=REPROVADO]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .seg button.on[data-r=SUCATA]{background:var(--warn-bg);border-color:#C99A00;color:var(--warn)}
  .scan{display:flex;gap:8px;margin-top:12px}
  .scan input{flex:1;min-width:0;font-size:20px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;min-height:60px}
  .scan input::placeholder{text-transform:none;letter-spacing:0;font-weight:400;font-size:17px;color:#9AA09A}
  .scan button{width:60px;flex:none;border:0;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;transition:transform var(--fast) var(--ease)}
  .scan button:active{transform:scale(.92)}
  .scan button.cam{background:var(--green-soft);color:var(--green)}
  .scan button svg{width:26px;height:26px}
  .note{background:var(--green-soft);color:var(--green-2);border-radius:12px;padding:12px 14px;font-size:15px;margin-top:12px}

  /* Barra fixa no rodapé (alcance do polegar) */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(180deg,rgba(245,246,243,0),var(--bg) 30%);animation:dockIn var(--mid) var(--ease) both}
  .dock .inner{max-width:560px;margin:0 auto}
  .dock .btn{margin:0;min-height:64px;font-size:20px}
  @keyframes dockIn{from{transform:translateY(100%)}to{transform:none}}

  /* ===== Serviços ===== */
  .back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--green);font-weight:700;font-size:17px;padding:10px 4px;margin:-6px 0 6px}
  .back svg{width:22px;height:22px}
  /* Categorias: faixa que rola de ponta a ponta da tela, com esmaecimento nas bordas (nada aparece "cortado") */
  .chipsbox{position:relative;margin:10px -16px 0}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scroll-snap-type:x proximity;scroll-padding:0 16px;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
  .chips::-webkit-scrollbar{display:none}
  .chipsbox::before,.chipsbox::after{content:"";position:absolute;top:0;bottom:8px;width:48px;pointer-events:none;z-index:1;transition:opacity var(--fast)}
  .chipsbox::before{left:0;background:linear-gradient(90deg,var(--bg),rgba(245,246,243,0))}
  .chipsbox::after{right:0;background:linear-gradient(270deg,var(--bg),rgba(245,246,243,0))}
  .chipsbox.ini::before,.chipsbox.fim::after{opacity:0}
  .chip{flex:none;scroll-snap-align:start;white-space:nowrap;min-height:42px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;color:var(--ink-2);transition:background var(--fast) var(--ease),color var(--fast),border-color var(--fast),transform var(--fast) var(--ease)}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 12px rgba(0,103,52,.22)}
  .chip .n{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;opacity:.65}
  .svcgroup h3{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin:18px 2px 8px}
  .svcbtn{display:flex;width:100%;text-align:left;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 8px;min-height:64px;transition:transform var(--fast) var(--ease),border-color var(--fast)}
  .svcbtn:active{transform:scale(.98);border-color:var(--green)}
  .svcbtn .dotc{width:10px;height:10px;border-radius:50%;background:var(--lime);flex:none}
  .svcbtn b{flex:1;font-weight:600;font-size:17px;line-height:1.25}
  .svcbtn small{color:var(--muted);font-size:13px;white-space:nowrap}
  .svcbtn .go{color:var(--green);width:20px;height:20px;flex:none}

  /* ===== Lotes ===== */
  .lote{border-left:5px solid var(--lime)}
  .lote .t{font-weight:800;font-size:19px;line-height:1.2}
  .lote .d{color:var(--muted);font-size:14.5px;margin-top:4px}
  .lote .tiles{margin-top:12px}
  .row{display:flex;gap:10px}.row>*{flex:1}

  /* ===== Login ===== */
  .login{padding-top:12px}
  .login .brand{text-align:center;margin:8px 0 20px}
  .login .brand img{height:68px;width:auto}
  .login .brand p{margin:8px 0 0;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .pindots{display:flex;justify-content:center;gap:16px;margin:16px 0 6px}
  .pindots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--green);transition:background var(--fast),transform var(--fast) var(--ease)}
  .pindots i.f{background:var(--green);transform:scale(1.12)}
  .pindots.shake{animation:shake 380ms var(--ease)}
  @keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .pinpad button{min-height:64px;border:1.5px solid var(--line);background:#fff;border-radius:16px;font-size:26px;font-weight:600;transition:transform 90ms var(--ease),background var(--fast)}
  .pinpad button:active{transform:scale(.93);background:var(--green-soft)}
  .pinpad button.k-ok{background:var(--green);color:#fff;border-color:var(--green);font-size:20px;font-weight:800}
  .pinpad button.k-del{color:var(--muted);font-size:22px}

  /* ===== Bottom sheet ===== */
  .modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,25,15,.45);animation:fadeIn var(--mid) var(--ease) both}
  .modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + var(--safe-b));max-height:92vh;overflow:auto;animation:sheetUp 280ms var(--ease) both}
  .modal .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
  .modal.closing{animation:fadeOut 180ms ease both}
  .modal.closing .sheet{animation:sheetDown 180ms ease both}
  .modal h3{margin:0 0 8px;font-size:21px;font-weight:800}
  @keyframes fadeIn{from{opacity:0}} @keyframes fadeOut{to{opacity:0}}
  @keyframes sheetUp{from{transform:translateY(100%)}} @keyframes sheetDown{to{transform:translateY(100%)}}
  .qty{font-size:40px!important;text-align:center;font-weight:800;min-height:72px}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .steps button{min-height:50px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;font-weight:700;font-size:17px;transition:transform 90ms var(--ease)}
  .steps button:active{transform:scale(.93);background:var(--green-soft)}
  .timebox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
  .timebox div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
  .timebox small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .timebox b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  video{width:100%;border-radius:14px;background:#000}
  /* Leitor ao vivo */
  .scanner{position:fixed;inset:0;z-index:70;background:#000;color:#fff;animation:fadeIn 200ms var(--ease) both}
  .scanner.out{animation:fadeOut 180ms ease both}
  .scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0}
  .sc-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
  .sc-count{font-size:22px;font-weight:800;color:var(--yellow);font-variant-numeric:tabular-nums}
  .sc-mode{flex:1;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
  .sc-torch.on{background:var(--yellow);color:var(--ink)}
  .sc-frame{position:absolute;left:5%;right:5%;top:34%;height:18%;pointer-events:none}
  .sc-zoom{position:absolute;left:50%;top:calc(52% + 18px);transform:translateX(-50%);display:flex;gap:8px;background:rgba(0,0,0,.45);border-radius:999px;padding:5px}
  .sc-zoom button{min-width:52px;height:40px;border:0;border-radius:999px;background:transparent;color:#fff;font-weight:800;font-size:15px}
  .sc-zoom button.on{background:var(--yellow);color:var(--ink)}
  .sc-frame i{position:absolute;width:34px;height:34px;border:5px solid var(--yellow)}
  .sc-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
  .sc-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
  .sc-frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
  .sc-frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
  .sc-laser{position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--lime);box-shadow:0 0 12px var(--lime);animation:laser 1.6s ease-in-out infinite}
  @keyframes laser{0%,100%{transform:translateY(-34px);opacity:.5}50%{transform:translateY(34px);opacity:1}}
  .sc-flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(123,169,59,0)}
  .sc-flash.on{animation:scok 420ms var(--ease)}
  @keyframes scok{0%{box-shadow:inset 0 0 0 14px rgba(123,169,59,.95);background:rgba(123,169,59,.18)}100%{box-shadow:inset 0 0 0 0 rgba(123,169,59,0);background:transparent}}
  .sc-bottom{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + var(--safe-b));background:linear-gradient(0deg,rgba(0,0,0,.78) 60%,transparent)}
  .sc-last{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;text-align:center;min-height:32px;word-break:break-all}
  .sc-last b{color:var(--yellow)}
  .sc-dim{font-family:var(--f);font-size:16px;opacity:.75}
  .sc-pat{font-size:13.5px;text-align:center;opacity:.9;margin-top:6px;min-height:20px}
  .sc-pat button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;margin-left:6px}
  .sc-choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .sc-choices button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:54px;border:0;border-radius:12px;background:#fff;color:var(--ink);padding:10px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;text-align:left;animation:rise var(--mid) var(--ease) both}
  .sc-choices small{font-family:var(--f);color:var(--muted);font-size:12px}
  .sc-bottom .btn{margin-top:12px}
  /* Modos de leitura */
  .modes{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;margin-top:14px;position:relative}
  .modes button{position:relative;z-index:1;min-height:46px;border:0;background:none;border-radius:11px;font-weight:700;font-size:16px;color:var(--muted);transition:color var(--fast)}
  .modes button.on{color:var(--green)}
  .modes .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#fff;border-radius:11px;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:transform var(--mid) var(--ease)}
  .modes.is-lote .pill{transform:translateX(100%)}
  .lotebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .lotebar .btn{margin:0;min-height:58px;font-size:16px}
  .hint{font-size:14px;color:var(--muted);margin:10px 2px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .kbd{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:36px}
  .kbd.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
  .sync{font-size:13px;font-weight:700;color:var(--muted)}
  .sync.busy{color:#B57F00}
  .checks{list-style:none;margin:8px 0 0;padding:0;max-height:46vh;overflow:auto}
  .checks li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line-2)}
  .checks li:first-child{border-top:0}
  .checks input{width:26px;height:26px;min-height:0;accent-color:var(--green);flex:none}
  .checks .s{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;word-break:break-all;text-align:left}
  .checks small{color:var(--muted);font-size:12px}
  textarea.lista{min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;text-transform:uppercase}

  /* ===== Toast e carregando ===== */
  .toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 18px;border-radius:14px;font-size:16px;font-weight:500;z-index:80;width:max-content;max-width:calc(100vw - 32px);box-shadow:0 10px 28px rgba(0,0,0,.25);animation:toastIn 260ms var(--ease) both;display:flex;gap:10px;align-items:center}
  .toast.ok{background:var(--green)}
  .toast.err{background:var(--bad)}
  .toast.out{animation:toastOut 200ms ease both}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}
  @keyframes toastOut{to{opacity:0;transform:translate(-50%,10px)}}
  .loading{position:fixed;inset:0;z-index:55;background:rgba(245,246,243,.0);display:flex;align-items:center;justify-content:center;animation:dim 1ms 140ms forwards}
  .loading .sp{width:52px;height:52px;border-radius:50%;border:5px solid var(--green-soft);border-top-color:var(--green);animation:spin .7s linear infinite;opacity:0;transition:opacity .2s}
  @keyframes dim{to{background:rgba(245,246,243,.55)}}
  .loading .sp{animation:spin .7s linear infinite,show 1ms 140ms forwards}
  @keyframes show{to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
</style>
</head>

async function lerFoto(file) {
  busy(true);
  const codigos = [];
  try {
    const formatos = await BarcodeDetector.getSupportedFormats();
    const det = new BarcodeDetector({formats: formatos});
    const bmp = await createImageBitmap(file);
    const vistos = {};
    (await det.detect(bmp)).forEach(c => { const v = String(c.rawValue || '').replace(/\s+/g, '').toUpperCase(); if (v && !vistos[v]) { vistos[v] = 1; codigos.push({v, f: c.format}); } });
  } catch (e) { busy(false); return erroLeitura('Não consegui ler a foto. Tente de novo, mais perto e com luz.'); }
  busy(false);
  if (!codigos.length) return erroLeitura('Nenhum código encontrado. Aproxime a câmera e evite reflexo.');
  if (!fotoLote && codigos.length === 1) return addSerial(codigos[0].v);
  if (!fotoLote) return escolherCodigo(codigos);
  codigos.forEach(c => { if (!lidosLote.some(x => x.v === c.v)) lidosLote.push(c); });
  mostrarLote();
}

  const v = await ask('Qual é o serial?', html, 'Usar o primeiro', root => {
    root.querySelector('.checks').onclick = e => { const b = e.target.closest('[data-i]'); if (b) fecharModal(() => addSerial(codigos[Number(b.dataset.i)].v)); };
  }, () => codigos[0].v);
  if (v) addSerial(v);
}
/* Pré-marca os códigos que parecem seriais: o formato e comprimento mais comuns na foto */
function mostrarLote() {
  const freq = {};
  lidosLote.forEach(c => { const k = c.f + '|' + c.v.length; freq[k] = (freq[k] || 0) + 1; });
  const top = Object.keys(freq).sort((a, b) => freq[b] - freq[a])[0];
  const ja = new Set(EST.aberta.seriais.map(x => x.serial));

  let mais = false;

}

/* ---------- câmera ao vivo: lê um código atrás do outro, só apontando ---------- */
let SC_ = null, scCanvas = null, scQuadro = 0;
/* Alterna: quadro inteiro / recorte ampliado da moldura. O recorte ampliado lê códigos pequenos e finos. */
async function detectar(det, video) {
  scQuadro++;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || scQuadro % 2) return det.detect(video);
  const cw = vw * 0.9, ch = vh * 0.34, x = (vw - cw) / 2, y = vh * 0.33;
  const esc = Math.min(2, 2400 / cw);
  scCanvas = scCanvas || document.createElement('canvas');
  scCanvas.width = Math.round(cw * esc); scCanvas.height = Math.round(ch * esc);
  const g = scCanvas.getContext('2d', {willReadFrequently: true});
  g.imageSmoothingEnabled = false;
  g.drawImage(video, x, y, cw, ch, 0, 0, scCanvas.width, scCanvas.height);
  return det.detect(scCanvas);
}
async function abrirCamera(lote) {
  if (EM_GOOGLE || !navigator.mediaDevices || !('BarcodeDetector' in window)) return abrirFoto(lote);

  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 2560}, height: {ideal: 1440}}, audio: false});
  } catch (e) { toast('Libere a câmera para este site nas permissões do Chrome.', 'err'); return; }
  const formatos = await BarcodeDetector.getSupportedFormats();
  const det = new BarcodeDetector({formats: formatos});
  const el = document.createElement('div');
  el.className = 'scanner';
  el.innerHTML = `
    <video playsinline muted autoplay></video>
    <div class="sc-top"><span class="sc-count" id="scCount">0 lidos</span><span class="sc-mode">${lote ? 'Em lote' : 'Um a um'}</span>
      <button class="ibtn sc-torch hidden" id="scTorch" aria-label="Lanterna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M7 2h10l-2 6H9zM9 8h6v13H9z"/></svg></button>
      <button class="ibtn" id="scClose" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sc-frame"><i></i><i></i><i></i><i></i><div class="sc-laser"></div></div>
    <div class="sc-zoom hidden" id="scZoom"></div>
    <div class="sc-flash" id="scFlash"></div>
    <div class="sc-bottom">
      <div class="sc-last" id="scLast"><span class="sc-dim">Encaixe o código na moldura. Etiqueta pequena? Use 2x ou 3x.</span></div>
      <div class="sc-pat" id="scPat"></div>
      <div class="sc-choices" id="scChoices"></div>
      <button class="btn cta" id="scDone">Concluir</button>
    </div>`;
  document.body.appendChild(el);
  const video = el.querySelector('video');
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  const track = stream.getVideoTracks()[0];
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({advanced: [{focusMode: 'continuous'}]});

    if (caps.zoom && caps.zoom.max > 1) {
      const niveis = [1, 2, 3].filter(z => z >= caps.zoom.min && z <= caps.zoom.max);
      const pref = Number(lerPref('mro_zoom')) || Math.min(2, caps.zoom.max);
      const setZoom = z => { track.applyConstraints({advanced: [{zoom: z}]}).catch(() => {}); salvarPref('mro_zoom', String(z)); $('scZoom').querySelectorAll('button').forEach(b => b.classList.toggle('on', Number(b.dataset.z) === z)); };
      $('scZoom').innerHTML = niveis.map(z => `<button type="button" data-z="${z}">${z}x</button>`).join('');
      $('scZoom').onclick = e => { const b = e.target.closest('[data-z]'); if (b) { buzz(6); setZoom(Number(b.dataset.z)); } };
      $('scZoom').classList.remove('hidden');
      setZoom(niveis.includes(pref) ? pref : niveis[niveis.length - 1]);
    }
  } catch (e) {}
  let lock = null; try { lock = await navigator.wakeLock.request('screen'); } catch (e) {}

  SC_.fechar = () => fechar();
  const fechar = () => {
    SC_.vivo = false; stream.getTracks().forEach(t => t.stop()); try { lock && lock.release(); } catch (e) {}
    el.classList.add('out'); setTimeout(() => el.remove(), 200); SC_ = null; focoLeitor();
  };
  $('scClose').onclick = fechar; $('scDone').onclick = fechar;
  $('scTorch').onclick = () => { SC_.torch = !SC_.torch; track.applyConstraints({advanced: [{torch: SC_.torch}]}).catch(() => {}); $('scTorch').classList.toggle('on', SC_.torch); };
  mostrarPadrao();
  const loop = async () => {
    if (!SC_ || !SC_.vivo) return;
    try { if (video.readyState >= 2) tratarLeitura(await detectar(det, video)); } catch (e) {}
    setTimeout(loop, 60);
  };
  loop();
}
/* Padrão do serial = formato + comprimento do 1º código aceito; evita pegar MAC, EAN etc. da mesma etiqueta */
function bateComPadrao(c) { const p = SC_.padrao; return !p || (c.f === p.f && c.v.length === p.len); }
function mostrarPadrao() {
  const el = $('scPat'); if (!el || !SC_) return;
  el.innerHTML = SC_.padrao ? `Aceitando só: <b>${esc(SC_.padrao.f.replace('_', ' ').toUpperCase())} · ${SC_.padrao.len} caracteres</b> <button type="button" id="scReset">trocar</button>` : '';
  const r = $('scReset'); if (r) r.onclick = () => { SC_.padrao = null; mostrarPadrao(); };
}
function tratarLeitura(barcodes) {
  if (!SC_ || SC_.escolhendo || !barcodes.length) return;
  const agora = Date.now(), ja = new Set(EST.aberta.seriais.map(x => x.serial));
  const codigos = [];
  barcodes.forEach(b => { const v = String(b.rawValue || '').replace(/\s+/g, '').toUpperCase(); if (v && !codigos.some(c => c.v === v)) codigos.push({v, f: b.format}); });
  const novos = codigos.filter(c => !ja.has(c.v) && !(SC_.recentes[c.v] && agora - SC_.recentes[c.v] < 2500));
  codigos.forEach(c => { SC_.recentes[c.v] = agora; });
  if (!novos.length) { if (SC_.ultimo && codigos.some(c => ja.has(c.v))) $('scLast').innerHTML = `<b>${esc(SC_.ultimo)}</b><div class="sc-dim">✓ salvo — aponte para o próximo</div>`; return; }
  if (!SC_.padrao) {
    if (novos.length === 1) { SC_.padrao = {f: novos[0].f, len: novos[0].v.length}; mostrarPadrao(); }
    else { return escolherNaCamera(novos); }
  }
  let aceitos = novos.filter(bateComPadrao);
  if (!SC_.lote) aceitos = aceitos.slice(0, 1);
  if (!aceitos.length) return;
  aceitarNaCamera(aceitos.map(c => c.v));
}
function aceitarNaCamera(valores) {
  const n = adicionarNaFila(valores);
  if (!n || !SC_) return;
  SC_.lidos += n;
  $('scCount').textContent = SC_.lidos + (SC_.lidos === 1 ? ' lido' : ' lidos');
  SC_.ultimo = valores[valores.length - 1];
  $('scLast').innerHTML = valores.length > 1 ? `<b>+${valores.length}</b> ${esc(SC_.ultimo)}` : `<b>${esc(SC_.ultimo)}</b>`;
  const f = $('scFlash'); f.classList.remove('on'); f.offsetWidth; f.classList.add('on');
}
/* Etiqueta com vários códigos e ainda sem padrão: a pessoa toca no serial na própria tela da câmera */
function escolherNaCamera(cods) {
  SC_.escolhendo = true;
  $('scLast').textContent = 'Toque no serial:';
  $('scChoices').innerHTML = cods.map((c, i) => `<button type="button" data-i="${i}"><b>${esc(c.v)}</b><small>${esc(c.f)}</small></button>`).join('');
  $('scChoices').onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b || !SC_) return;
    const c = cods[Number(b.dataset.i)];
    SC_.padrao = {f: c.f, len: c.v.length}; SC_.escolhendo = false; $('scChoices').innerHTML = ''; mostrarPadrao();
    aceitarNaCamera(SC_.lote ? cods.filter(bateComPadrao).map(x => x.v) : [c.v]);
  };
}

function fecharModal(cb) {

function ask(title, html, okTxt, onOpen, collect, perigo) {
  return new Promise(res => {
    const root = $('modalRoot');
    root.innerHTML = `<div class="modal"><div class="sheet"><div class="grab"></div><h3>${esc(title)}</h3>${html}
      <div class="row"><button class="btn ghost" data-x="0">Voltar</button><button class="btn ${perigo ? 'danger' : ''}" data-x="1">${esc(okTxt)}</button></div></div></div>`;
    const sheet = root.querySelector('.sheet');
    if (onOpen) onOpen(sheet);
    root.querySelector('.modal').onclick = e => {
      const b = e.target.closest('[data-x]'); const x = b && b.dataset.x;
      if (e.target.classList.contains('modal') || x === '0') { fecharModal(() => res(false)); }
      else if (x === '1') { const v = collect ? collect(sheet) : true; if (v === false) return; fecharModal(() => res(v)); }
    };
  });
}

/* ---------- início ---------- */
buildPinPad(); drawPin();
call('getBootstrap').then(b => {
  BOOT = b;
  $('selNome').innerHTML = '<option value="" selected>Toque para escolher seu nome</option>' + b.colaboradores.map(c => `<option>${esc(c.nome)}</option>`).join('');
  $('selNome').value = '';
}).catch(e => toast('Erro ao carregar: ' + e, 'err'));
</script>
